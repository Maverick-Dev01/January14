<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Nuestra Historia</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="bg"></div>

  <audio id="bg-music" loop>
    <source src="music/cancion.mp3" type="audio/mpeg">
  </audio>

  <main class="app">
    <section class="scene" id="scene">
      <div class="book" id="book">
        
        <div class="pages">
          <div class="page-edge page-edge--left"></div>
          <div class="page-edge page-edge--right"></div>

          <div class="spread">
            
            <div class="page page--left">
              <div class="page__inner">
                <div class="page__meta">
                  <span class="badge" id="chapterBadge">Capítulo I</span>
                  <span class="sep">•</span>
                  <span class="small" id="chapterSubtitle">Inicio</span>
                </div>

                <h2 class="page__title" id="chapterTitle">Título del Capítulo</h2>
                <div class="page__text custom-scroll" id="chapterText">
                  </div>
                
                <div class="page__footer">
                  <span class="small" id="chapterIndex">1 / 24</span>
                </div>
              </div>
            </div>

            <div class="page page--right">
              <div class="page__inner page__center">
                <div class="photo-frame">
                  <div class="photo-container">
                    <img id="chapterImage" src="" alt="Foto del recuerdo" class="photo-img">
                  </div>
                  <div class="photo-caption" id="imageCaption">Nosotros</div>
                </div>
              </div>
            </div>

            <div class="gutter"></div>
          </div>
        </div>

        <div class="cover">
          <div class="cover__texture"></div>
          <div class="cover__frame"></div>
          <div class="sigil">⚜️</div>
          <h1 class="cover__title">
            Nuestra<br><span>Historia</span>
          </h1>
          <p class="cover__subtitle" id="coverSubtitle">Capítulo I</p>
          <div class="sigil">⚜️</div>
        </div>

      </div>
    </section>

    <section class="controls">
      <button class="btn btn--primary" id="btnOpen">Abrir Carta</button>
      
      <div class="controls__nav" id="navControls">
        <button class="btn btn--nav" id="btnPrev">← Anterior</button>
        <button class="btn btn--nav" id="btnNext">Siguiente →</button>
      </div>

      <button class="btn btn--ghost" id="btnClose" disabled>Cerrar</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
