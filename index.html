<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi civilización favorita</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        /* --- CONFIGURACIÓN DEL MUNDO (FONDO) --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #4a1c6e, #240b36); /* Degradado Lila oscuro */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            perspective: 1000px; /* Para el efecto 3D */
        }

        /* Efecto de partículas/estrellas flotando */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: floatUp 20s linear infinite;
        }

        /* --- DECORACIÓN (Tiburones y Lotos) --- */
        .shark {
            position: absolute;
            width: 150px; /* Ajusta según tu imagen */
            opacity: 0.6;
            z-index: 1;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .shark-1 { top: 20%; left: -200px; animation: swimRight 25s infinite linear; }
        .shark-2 { top: 50%; right: -200px; animation: swimLeft 30s infinite linear; transform: scaleX(-1); }

        .lotus-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none; /* Para que no estorben el clic */
        }

        .lotus {
            font-size: 60px; /* Si usas imagen, cambia esto por width */
            animation: floatWater 4s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #d4af37);
        }

        /* --- EL LIBRO --- */
        .scene {
            position: relative;
            z-index: 20;
            transition: transform 1.5s ease-in-out;
        }

        /* Estado cuando se lee (Zoom in) */
        .scene.reading-mode {
            transform: scale(1.6) translateY(-20px);
        }

        .book {
            width: 280px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* Portada */
        .cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #5c3a21; /* Color cuero marrón */
            /* Si tienes una textura de cuero, pon: background-image: url('cuero.jpg'); */
            border-radius: 5px 15px 15px 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform-origin: left;
            z-index: 2;
            transition: transform 1.5s;
            border: 2px solid #c29828; /* Borde dorado */
        }

        /* Decoración de la portada */
        .cover::before {
            content: '';
            position: absolute;
            top: 10px; bottom: 10px; left: 10px; right: 10px;
            border: 2px solid #c29828;
            border-radius: 2px 10px 10px 2px;
        }

        .title {
            color: #d4af37; /* Dorado */
            font-family: 'Great Vibes', cursive;
            font-size: 3em;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            margin: 0;
        }

        .subtitle {
            color: #d4af37;
            font-size: 0.8em;
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Páginas internas */
        .pages {
            position: absolute;
            width: 95%;
            height: 96%;
            top: 2%;
            left: 2%;
            background: #f4e4bc; /* Color papiro antiguo */
            border-radius: 3px 12px 12px 3px;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Cinzel', serif;
            font-size: 10px; /* Pequeño porque haremos zoom */
            color: #2c1a0b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 30px rgba(92, 58, 33, 0.3);
        }

        /* Cuando el libro se abre */
        .book.open .cover {
            transform: rotateY(-180deg);
        }

        /* --- BOTÓN DE INICIO --- */
        #start-btn {
            margin-top: 50px;
            padding: 15px 40px;
            background: linear-gradient(45deg, #5c3a21, #8a5a3a);
            color: #d4af37;
            border: 2px solid #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50px;
            transition: opacity 0.5s, transform 0.3s;
            box-shadow: 0 0 15px #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #d4af37;
        }

        .controls {
            position: absolute;
            bottom: 15%;
            text-align: center;
            width: 100%;
            z-index: 30;
        }

        /* ANIMACIONES */
        @keyframes floatUp { from { background-position: 0 0; } to { background-position: 0 -1000px; } }
        @keyframes swimRight { from { left: -200px; } to { left: 100vw; } }
        @keyframes swimLeft { from { right: -200px; } to { right: 100vw; } }
        @keyframes floatWater { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Ocultar elementos */
        .hidden { opacity: 0; pointer-events: none; }

    </style>
</head>
<body>

    <audio id="bg-music">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="particles"></div>
    
    <div class="shark shark-1" style="font-size: 100px;">🦈</div>
    <div class="shark shark-2" style="font-size: 80px;">🦈</div>
    
    <div class="lotus-container">
        <div class="lotus" style="animation-delay: 0s;">🪷</div>
        <div class="lotus" style="animation-delay: 1s;">🌸</div>
        <div class="lotus" style="animation-delay: 2s;">🪷</div>
        <div class="lotus" style="animation-delay: 0.5s;">🌸</div>
    </div>

    <div class="scene" id="scene">
        <div class="book" id="book">
            <div class="pages">
                <h3>14 de Enero</h3>
                <p>Hace muchos años, las antiguas civilizaciones hablaban de tesoros incalculables...</p>
                <p>Yo no creía en leyendas, hasta que te conocí a ti.</p>
                <p>Eres mi imperio, mi historia y mi flor de loto favorita.</p>
                <h2 style="color: #8b0000; margin-top: 20px;">¡Feliz Cumpleaños!</h2>
                <p style="font-size: 8px;">(Te amo)</p>
            </div>

            <div class="cover">
                <div style="font-size: 40px;">⚜️</div>
                <h1 class="title">Nuestra<br>Historia</h1>
                <p class="subtitle">Bitácora de viaje</p>
                <div style="font-size: 40px; margin-top: 20px;">⚜️</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn">Abrir el libro</button>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const book = document.getElementById('book');
        const scene = document.getElementById('scene');
        const audio = document.getElementById('bg-music');

        btn.addEventListener('click', () => {
            // 1. Reproducir música
            audio.play().catch(e => console.log("Error de audio:", e));
            
            // 2. Ocultar botón
            btn.classList.add('hidden');

            // 3. Hacer zoom a la escena (acercar el libro)
            scene.classList.add('reading-mode');

            // 4. Abrir el libro (con un pequeño retraso para que se vea real)
            setTimeout(() => {
                book.classList.add('open');
            }, 600); // Espera 0.6 segundos mientras hace zoom
        });

        // Opcional: Cerrar libro si le das clic de nuevo
        book.addEventListener('click', () => {
            if(book.classList.contains('open')) {
                // Si quieres que se pueda cerrar, descomenta esto:
                // book.classList.remove('open');
                // scene.classList.remove('reading-mode');
                // btn.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
